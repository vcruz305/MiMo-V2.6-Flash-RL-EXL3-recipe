# TabbyAPI config for serving MiMo-V2.6-Flash-RL EXL3.
# Hardware requirement: one GPU with about 96 GB of VRAM. The card these numbers
# were measured on is named in the root README, Cards tested on.
#
# exllamav3-tabby/serve.sh renders this into the state dir, filling the
# dollar-brace fields from its own variables and the environment.
#
# Every key below was accepted by TabbyAPI main (commit f07131cd) via
# TabbyConfigModel.model_validate, with no unknown keys. cache_mode is FP16,
# matching the native launches (they pass no cache-quant flag).

network:
  host: ${HOST}
  port: ${PORT}
  # true only when bound to loopback (serve.sh decides). Otherwise TabbyAPI writes
  # api_tokens.yml into its own directory and clients need the key.
  disable_auth: ${DISABLE_AUTH}
  api_servers: ["OAI"]

logging:
  log_prompt: false
  log_generation_params: false
  log_requests: false

model:
  # An isolated view directory holding one symlink: TabbyAPI lists every
  # directory under model_dir, so pointing it at a shared models folder would
  # advertise unrelated packs.
  model_dir: ${MODEL_PARENT}
  model_name: ${MODEL_NAME}
  backend: exllamav3
  inline_model_loading: false

  # max_seq_len is the per-request ceiling; cache_size is one pool shared by
  # every concurrent request. These are the values the SixCat runs used.
  max_seq_len: ${MAX_SEQ_LEN}
  cache_size: ${CACHE_SIZE}
  cache_mode: FP16
  chunk_size: 2048
  max_batch_size: ${MAX_BATCH_SIZE}

  vision: false
  warmup: true
  reasoning: true

draft_model:
  # DFlash is a separate model directory, not an MTP head. serve.sh sets
  # DRAFT_MODE to "model" when DRAFT=1 (the default; 185.52 tok/s p50) and to
  # "disabled" when DRAFT=0 (46.62 tok/s p50). Depth 7 is the drafter default
  # (block size 8 minus 1). The drafter directory must already have the two
  # corrections in the root README (tap_shift 0 and the mask_embedding shard).
  draft_mode: ${DRAFT_MODE}
  draft_model_dir: ${DRAFT_PARENT}
  draft_model_name: ${DRAFT_NAME}
  draft_cache_mode: FP16
  draft_num_tokens: ${DRAFT_NUM_TOKENS}
  dynamic_draft: false

memory:
  sysmem_recurrent_cache: 4096
