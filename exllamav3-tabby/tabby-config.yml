# TabbyAPI config for serving MiMo-V2.6-Flash-RL EXL3 (one ~96 GB GPU; the card these
# numbers were measured on is named in the root README > Cards tested on).
#
# exllamav3-tabby/serve.sh renders this into <recipe home>/state/tabby-config.yml, filling the
# dollar-brace fields from its own variables and the environment.
#
# STATUS: modeled on the sibling Qwen3.8-Flash-Next recipe's config, which is validated against
# TabbyAPI main's own schema. THIS file has not been validated against TabbyAPI main on the box
# yet, and it has never served this pack. Keys marked "UNVERIFIED" are the ones the in-progress
# measurement is pinning down:
#
#   bash exllamav3-tabby/setup.sh --check-config     # validates against TabbyAPI's own schema
#
# Do not fill in numbers anywhere in this folder from the native route's results.

network:
  host: ${HOST}
  port: ${PORT}
  # true only when bound to loopback (serve.sh decides). Otherwise TabbyAPI writes
  # api_tokens.yml into its own directory and clients need the key.
  disable_auth: ${DISABLE_AUTH}
  api_servers: ["OAI"]

logging:
  log_prompt: false
  log_generation_params: false
  log_requests: false

model:
  model_dir: ${MODEL_PARENT}
  model_name: ${MODEL_NAME}
  backend: exllamav3
  inline_model_loading: false

  # Context and concurrency: the measured native configuration, so the routes are comparable.
  # max_seq_len is the per-request ceiling; cache_size is ONE pool shared by all concurrent
  # requests. Neither has been tuned for this route yet - do not present a re-tune as measured
  # until it is run.
  max_seq_len: ${MAX_SEQ_LEN}
  cache_size: ${CACHE_SIZE}
  max_batch_size: ${MAX_BATCH_SIZE}

  # fp16 KV, matching the measured native configuration (which passes no -cq). The sibling Qwen
  # recipe measures 8-bit KV ("8,8") as a win on the card that recipe was measured on; for this
  # pack on this card it is untested.
  cache_mode: "16,16"

  # UNVERIFIED for this pack: TabbyAPI's chunk size was not exercised here yet.
  chunk_size: 2048

  # MiMo-V2.6-Flash-RL is natively multimodal (vision + audio tokens in the template). The
  # measured native runs were text-only and so is this route.
  vision: false
  warmup: true

  # Reasoning: MiMo's template has a <think> branch. The native server surfaced reasoning
  # separately (reasoning_content); whether TabbyAPI's splitter maps it identically is UNVERIFIED.
  reasoning: true

  # UNVERIFIED: MiMo's template renders tool calls as
  #   <tool_call><function=NAME><parameter=k>v</parameter></function></tool_call>
  # which is Qwen-shaped but wrapped in <tool_call>. Confirm against TabbyAPI main's parser before
  # relying on tool calls; the native route does not parse tool calls at all.
  tool_format: qwen3_5

# Draft model: NOT wired yet, on purpose.
#
# The MiMo drafter is a separate DFlash model directory (see the root README, "The DFlash fix"),
# not an MTP head, and TabbyAPI's key for a separate drafter directory - and whether it applies
# the tap_shift / mask_embedding corrections the same way - is exactly what the in-progress
# measurement is pinning down. Until then this route runs draft-free, and the 184.46 tok/s figure
# belongs to the native route only.
#
# draft_model:
#   draft_mode: model
#   draft_model_dir: ${DRAFT_DIR}      # UNVERIFIED key name
#   draft_num_tokens: 7                # the drafter's default: block_size 8 - 1
#   dynamic_draft: false

memory:
  # SWA layers are cached recurrently by the engine. This value is the sibling recipe's; it is
  # UNVERIFIED here.
  sysmem_recurrent_cache: 4096
